<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub - Intelligent Workspace</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <!-- Prism.js for VS Code Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.25);
            --primary-light: #a78bfa;
            --secondary: #06d6a0;
            --secondary-glow: rgba(6, 214, 160, 0.2);
            --accent: #f472b6;
            --accent-glow: rgba(244, 114, 182, 0.2);
            --bg-dark: #030712;
            --glass-bg: rgba(8, 12, 28, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --sidebar-bg: rgba(5, 8, 18, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --message-user: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #3b82f6 100%);
            --message-ai: rgba(15, 20, 40, 0.6);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 40px rgba(139, 92, 246, 0.15);
            --sidebar-width: 290px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Aurora Background */
        .bg-gradient {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background: #030712;
            overflow: hidden;
        }

        .mesh-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(6, 214, 160, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 114, 182, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(59, 130, 246, 0.18) 0px, transparent 50%);
            filter: blur(100px);
            animation: meshShift 15s ease-in-out infinite alternate;
        }

        @keyframes meshShift {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(3deg); }
        }

        /* Aurora Effect */
        .aurora {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(139, 92, 246, 0.08) 40%,
                rgba(6, 214, 160, 0.06) 50%,
                rgba(244, 114, 182, 0.08) 60%,
                transparent 70%
            );
            animation: auroraMove 20s linear infinite;
            filter: blur(60px);
        }

        @keyframes auroraMove {
            0% { transform: rotate(0deg) translateX(-10%); }
            100% { transform: rotate(360deg) translateX(-10%); }
        }

        .blob {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, rgba(139, 92, 246, 0) 70%);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            animation: move 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blob-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(6, 214, 160, 0.25) 0%, rgba(6, 214, 160, 0) 70%);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            right: 0;
            bottom: 0;
            animation: move2 30s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blob-3 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.2) 0%, rgba(244, 114, 182, 0) 70%);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            left: 30%;
            top: 40%;
            animation: move3 22s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes move {
            from { transform: translate(-15%, -15%) scale(1); }
            to { transform: translate(35%, 25%) scale(1.15); }
        }

        @keyframes move2 {
            from { transform: translate(15%, 15%) scale(1.15); }
            to { transform: translate(-35%, -25%) scale(1); }
        }

        @keyframes move3 {
            from { transform: translate(0%, 0%) scale(1); }
            to { transform: translate(20%, -15%) scale(1.2); }
        }

        /* Floating Particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 15s infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 12s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; animation-duration: 18s; }
        .particle:nth-child(3) { left: 35%; animation-delay: 4s; animation-duration: 14s; }
        .particle:nth-child(4) { left: 50%; animation-delay: 1s; animation-duration: 20s; }
        .particle:nth-child(5) { left: 65%; animation-delay: 3s; animation-duration: 16s; }
        .particle:nth-child(6) { left: 75%; animation-delay: 5s; animation-duration: 22s; }
        .particle:nth-child(7) { left: 85%; animation-delay: 2.5s; animation-duration: 13s; }
        .particle:nth-child(8) { left: 92%; animation-delay: 4.5s; animation-duration: 19s; }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }
        /* Bad Practice */

/* Pastikan area chat tumbuh fleksibel dan input tetap di bawah */
            .chat-messages {
                flex: 1;
                overflow-y: auto;
            }
            
            .input-container {
                flex-shrink: 0;
            }
        /* Main Container */
        .app-container {
            width: 98%;
            max-width: 1400px;
            height: 100dvh; /* Dynamic Viewport Height */
            flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(50px) saturate(1.5);
            -webkit-backdrop-filter: blur(50px) saturate(1.5);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            display: flex;
            flex-direction: row;
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                var(--shadow-glow);
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(139, 92, 246, 0.5), 
                rgba(6, 214, 160, 0.5), 
                rgba(244, 114, 182, 0.5),
                transparent
            );
            z-index: 100;
        }

        /* Sidebar Styling */
        .app-sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            z-index: 20;
            flex-shrink: 0;
            position: relative;
        }

        .app-sidebar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg,
                rgba(139, 92, 246, 0.3),
                transparent 30%,
                transparent 70%,
                rgba(6, 214, 160, 0.3)
            );
        }

        .app-sidebar.collapsed {
            width: 0;
            border-right-color: transparent;
        }

        .sidebar-header {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
        }

        .sidebar-logo-img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
            object-fit: cover;
        }

        .sidebar-logo-text {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .sidebar-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            display: none; /* Only visible on mobile */
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 6px;
        }

        .sidebar-close-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar-content {
            flex: 1;
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .sidebar-content::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .sidebar-btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            color: white;
            border: none;
            padding: 0.85rem 1rem;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px var(--primary-glow);
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .sidebar-btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .sidebar-btn-primary:hover::before {
            left: 100%;
        }

        .sidebar-btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
        }

        .sidebar-btn-primary:active {
            transform: translateY(-1px);
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .sidebar-section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding-left: 0.25rem;
        }

        .sidebar-nav-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            list-style: none;
        }

        .sidebar-nav-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.75rem 0.9rem;
            border-radius: 12px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .sidebar-nav-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 60%;
            background: var(--primary);
            border-radius: 0 4px 4px 0;
            transition: width 0.3s ease;
        }

        .sidebar-nav-btn:hover::before {
            width: 3px;
        }

        .sidebar-nav-btn:hover {
            color: white;
            background: rgba(139, 92, 246, 0.08);
            border-color: rgba(139, 92, 246, 0.15);
            transform: translateX(4px);
        }

        .sidebar-nav-btn.active {
            color: white;
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.15), transparent);
            border-color: rgba(139, 92, 246, 0.25);
        }

        .sidebar-nav-btn.active::before {
            width: 3px;
            background: var(--primary);
        }

        .sidebar-footer {
            padding: 1.25rem;
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.15);
        }

        .sidebar-status-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
        }

        .sidebar-status-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .sidebar-status-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .sidebar-status-desc {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Main Content Wrapper */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .app-header {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(10, 15, 30, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header-left-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .sidebar-toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--glass-border);
        }

        .sidebar-toggle-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .model-indicator {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            color: var(--text-main);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--secondary);
            box-shadow: 0 0 10px var(--secondary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.75rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar {
            width: 6px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }

        .chat-area::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* Message Bubbles */
        .message {
            max-width: 80%;
            padding: 1rem 1.4rem;
            border-radius: 20px;
            font-size: 0.98rem;
            line-height: 1.6;
            position: relative;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            animation: messageSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: var(--message-user);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 8px 25px -5px rgba(99, 102, 241, 0.35);
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--message-ai);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
        }

        /* Input Area */
        .input-container {
            padding: 1.25rem 2rem 1.75rem;
            background: rgba(10, 15, 30, 0.4);
            border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .controls-row {
            display: flex;
            justify-content: center; /* Center the model switcher */
            align-items: center;
            margin-bottom: 1rem;
        }

        .segmented-control {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.3rem;
            border-radius: 14px;
            gap: 0.25rem;
            border: 1px solid var(--glass-border);
        }

        .segment-btn {
            padding: 0.55rem 1.25rem;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .segment-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.02);
        }

        .segment-btn.active {
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 0.75rem 1.25rem;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            max-width: 900px;
            margin: 0 auto; /* Center input wrapper */
        }

        .input-wrapper:focus-within {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px -10px var(--primary-glow);
            border-color: rgba(99, 102, 241, 0.4);
        }

        #user-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 0.5rem 0;
            font-size: 1rem;
            line-height: 1.5;
            resize: none;
            max-height: 180px;
            background: transparent;
            color: var(--text-main);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        #user-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            box-shadow: 0 4px 10px var(--primary-glow);
        }

        .action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.4);
        }

        .action-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Loading Bubble */
        .loading-bubble {
            align-self: flex-start;
            padding: 1rem 1.5rem;
            background: var(--message-ai);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 6px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
        }

        .bounce {
            width: 7px;
            height: 7px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
            box-shadow: 0 0 5px var(--primary);
        }

        .bounce:nth-child(2) { animation-delay: 0.2s; }
        .bounce:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
            40% { transform: translateY(-6px); opacity: 1; }
        }

        /* Markdown & Code Block Styling */
        pre {
            background: #0d1117 !important;
            color: #c9d1d9 !important;
            padding: 2.2rem 1.25rem 1.25rem !important;
            border-radius: 12px !important;
            margin: 0 !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3) !important;
            white-space: pre-wrap !important;
            word-wrap: break-word !important;
            overflow-wrap: anywhere !important;
            max-width: 100%;
            box-sizing: border-box;
            tab-size: 4;
            line-height: 1.6 !important;
            position: relative;
        }

        code {
            font-family: var(--font-mono) !important;
            font-size: 0.88em !important;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 0.15rem 0.4rem;
            border-radius: 6px;
            font-weight: 500;
        }

        pre code {
            background: transparent !important;
            color: #c9d1d9 !important;
            padding: 0 !important;
            font-weight: 400 !important;
            display: block;
        }

        p {
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }

        ul, ol {
            margin: 0.5rem 0 0.8rem 1.5rem;
        }

        li {
            margin-bottom: 0.25rem;
        }

        h1, h2, h3 {
            margin: 1rem 0 0.5rem 0;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            line-height: 1.3;
            color: #f8fafc;
        }

        h1 { font-size: 1.25rem; }
        h2 { font-size: 1.15rem; }
        h3 { font-size: 1.05rem; }

        /* Tables */
        .message table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.88rem;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .message th {
            background: rgba(255, 255, 255, 0.04);
            font-weight: 700;
            text-align: left;
            padding: 0.75rem 1rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
            color: var(--secondary);
        }

        .message td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
        }

        .message tr:last-child td {
            border-bottom: none;
        }

        .message tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .message.user table,
        .message.user th,
        .message.user td {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .message.user th {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .message.user tr:hover td {
            background: rgba(255, 255, 255, 0.05);
        }

        .message hr {
            border: none;
            border-top: 1px solid var(--glass-border);
            margin: 1rem 0;
        }

        /* Telegram-Style Code Blocks */
        .code-wrapper {
            margin: 1rem 0;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
        }

        .code-lang-label {
            position: absolute;
            top: 10px;
            left: 14px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 5;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 10;
            opacity: 0;
        }

        .code-wrapper:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }

        .copy-btn.copied {
            background: var(--secondary) !important;
            color: white !important;
            border-color: var(--secondary) !important;
            opacity: 1 !important;
        }

        /* Message Actions */
        .message-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .action-btn-subtle {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            opacity: 0.7;
            border: 1px solid transparent;
        }

        .action-btn-subtle:hover {
            background: rgba(255, 255, 255, 0.04);
            color: white;
            border-color: rgba(255, 255, 255, 0.05);
            opacity: 1;
        }

        .message.user .action-btn-subtle {
            color: rgba(255, 255, 255, 0.6);
        }

        .message.user .action-btn-subtle:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .action-btn-subtle.copied {
            color: var(--secondary) !important;
        }

        .msg-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-right: 4px;
        }

        .message.user .msg-meta {
            color: rgba(255, 255, 255, 0.6);
        }

        /* File Upload */
        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            margin-bottom: 0;
            flex-shrink: 0;
        }

        .file-upload-label:hover {
            background: rgba(99, 102, 241, 0.1);
            color: #a5b4fc;
            border-color: rgba(99, 102, 241, 0.3);
        }

        .preview-area {
            display: none;
            padding: 8px 12px;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--glass-border);
            flex-wrap: wrap;
            border-radius: 12px;
            margin-bottom: 0.75rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .preview-item {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-preview {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .preview-item.preview-doc {
            width: auto;
            height: auto;
            min-width: 120px;
            max-width: 200px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.08);
            border: 1.5px solid var(--primary);
            border-radius: 10px;
        }

        .doc-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .doc-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .message-file {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            max-width: 260px;
        }

        .message.user .message-file {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
        }

        .message-img {
            max-width: 300px;
            max-height: 300px;
            border-radius: 12px;
            margin-top: 10px;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow-sm);
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 15, 0.8);
            backdrop-filter: blur(15px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: #0f1626;
            border: 1px solid var(--glass-border);
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            position: relative;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh;
            overflow-y: auto;
            color: var(--text-main);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        #custom-instructions {
            width: 100%;
            min-height: 100px;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
            resize: vertical;
            outline: none;
        }

        .settings-section {
            margin-bottom: 1.5rem;
        }

        .settings-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .api-input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .api-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            font-family: monospace;
            font-size: 0.9rem;
            outline: none;
        }

        .api-input:focus,
        #custom-instructions:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: rgba(255, 255, 255, 0.05);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn-secondary {
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-primary {
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px var(--primary-glow);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Context Indicator in Header */
        .context-badge-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--secondary);
            font-weight: 600;
            background: rgba(6, 182, 212, 0.1);
            padding: 0.45rem 0.9rem;
            border-radius: 20px;
            transition: all 0.3s ease;
            border: 1px solid rgba(6, 182, 212, 0.15);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.05);
        }

        /* Floating Scroll to Bottom Button */
        .scroll-bottom-btn {
            position: absolute;
            bottom: 120px;
            right: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--secondary);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            z-index: 99;
        }

        .scroll-bottom-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .scroll-bottom-btn:hover {
            background: #111827;
            color: white;
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }

        /* Sidebar Overlay */
        .sidebar-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.visible {
            display: block;
            opacity: 1;
        }

        /* ===== RESPONSIVE BREAKPOINTS ===== */

        /* Tablet & Small Desktop (max-width: 1024px) */
        @media (max-width: 1024px) {
            :root {
                --sidebar-width: 260px;
            }

            .app-container {
                width: 99%;
                border-radius: 20px;
            }

            .chat-area {
                padding: 1.25rem 1.5rem;
            }

            .input-container {
                padding: 1rem 1.5rem 1.5rem;
            }

            .blob { width: 500px; height: 500px; }
            .blob-2 { width: 400px; height: 400px; }
            .blob-3 { width: 350px; height: 350px; }
        }

        /* Mobile (max-width: 768px) */
        @media (max-width: 768px) {
            html, body {
                height: 100dvh;
                width: 100vw;
                overflow: hidden;
            }

            body {
                padding: 0;
                align-items: stretch;
            }

            .app-container {
                width: 100%;
                height: 100dvh;
                border-radius: 0;
                border: none;
            }

            /* Mobile Sidebar Overlay */
            .app-sidebar {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: min(var(--sidebar-width), 80vw);
                transform: translateX(-100%);
                background: #090d16;
                z-index: 200;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            }

            .app-sidebar.open {
                transform: translateX(0);
            }

            .sidebar-close-btn {
                display: flex;
            }

            .app-header {
                padding: 0.6rem 0.8rem;
                gap: 0.4rem;
            }

            .context-badge-header {
                padding: 0.35rem 0.5rem;
                font-size: 0.72rem;
                gap: 4px;
            }

            .context-badge-header .context-text {
                display: none;
            }

            .chat-area {
                padding: 1rem 0.8rem;
                gap: 1rem;
            }

            .message {
                max-width: 92%;
                font-size: 0.95rem;
                padding: 0.85rem 1rem;
                margin-bottom: 4px;
            }

            pre {
                padding: 1.8rem 0.8rem 0.8rem !important;
                font-size: 0.82rem !important;
                border-radius: 10px !important;
            }

            .code-wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .copy-btn {
                opacity: 1 !important;
                background: rgba(255, 255, 255, 0.08);
            }

            .message table {
                display: block;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                white-space: nowrap;
                font-size: 0.8rem;
            }

            .input-container {
                padding: 0.5rem 0.6rem 0.8rem;
                background: rgba(10, 15, 30, 0.65);
            }

            .controls-row {
                margin-bottom: 0.4rem;
            }

            .segmented-control {
                width: 100%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                padding: 0.2rem;
                border-radius: 12px;
                gap: 0.2rem;
                scrollbar-width: none;
            }

            .segmented-control::-webkit-scrollbar {
                display: none;
            }

            .segment-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.78rem;
                white-space: nowrap;
                flex-shrink: 0;
                border-radius: 8px;
            }

            .input-wrapper {
                padding: 0.45rem 0.7rem;
                gap: 0.5rem;
                border-radius: 16px;
            }

            #user-input {
                font-size: 0.95rem;
                max-height: 100px;
                padding: 0.4rem 0;
            }

            .action-btn {
                width: 38px;
                height: 38px;
                border-radius: 10px;
            }

            .file-upload-label {
                width: 34px;
                height: 34px;
            }

            .modal-content {
                padding: 1.2rem;
                width: 95%;
                border-radius: 16px;
                max-height: 85vh;
            }

            .message-img {
                max-width: 100%;
            }

            .scroll-bottom-btn {
                bottom: 75px;
                right: 12px;
                width: 36px;
                height: 36px;
            }

            /* Scale down decorative blobs */
            .blob { width: 350px; height: 350px; }
            .blob-2 { width: 300px; height: 300px; }
            .blob-3 { width: 250px; height: 250px; }

            .model-indicator {
                padding: 0.4rem 0.7rem;
                font-size: 0.78rem;
            }

            .sidebar-toggle-btn {
                width: 34px;
                height: 34px;
            }
        }

        /* Small Phones (max-width: 480px) */
        @media (max-width: 480px) {
            .app-sidebar {
                width: 85vw;
            }

            .app-header {
                padding: 0.5rem 0.6rem;
            }

            .header-left-controls {
                gap: 0.4rem;
            }

            .sidebar-toggle-btn {
                width: 32px;
                height: 32px;
            }

            .sidebar-toggle-btn svg {
                width: 18px;
                height: 18px;
            }

            .model-indicator {
                padding: 0.35rem 0.6rem;
                font-size: 0.72rem;
                gap: 0.4rem;
            }

            .status-dot {
                width: 6px;
                height: 6px;
            }

            .chat-area {
                padding: 0.75rem 0.5rem;
                gap: 0.75rem;
            }

            .message {
                max-width: 95%;
                font-size: 0.9rem;
                padding: 0.75rem 0.9rem;
                border-radius: 16px;
                line-height: 1.5;
            }

            pre {
                padding: 1.6rem 0.6rem 0.6rem !important;
                font-size: 0.78rem !important;
                border-radius: 8px !important;
            }

            code {
                font-size: 0.8em !important;
                padding: 0.1rem 0.3rem;
            }

            .segmented-control {
                padding: 0.15rem;
                gap: 0.15rem;
                border-radius: 10px;
            }

            .segment-btn {
                padding: 0.35rem 0.65rem;
                font-size: 0.72rem;
                border-radius: 7px;
            }

            .input-container {
                padding: 0.4rem 0.5rem 0.6rem;
            }

            .input-wrapper {
                padding: 0.4rem 0.6rem;
                gap: 0.4rem;
                border-radius: 14px;
            }

            #user-input {
                font-size: 0.9rem;
                max-height: 80px;
            }

            #user-input::placeholder {
                font-size: 0.85rem;
            }

            .action-btn {
                width: 36px;
                height: 36px;
                border-radius: 9px;
            }

            .action-btn svg {
                width: 18px;
                height: 18px;
            }

            .file-upload-label {
                width: 32px;
                height: 32px;
                border-radius: 9px;
            }

            .file-upload-label svg {
                width: 17px;
                height: 17px;
            }

            .message-img {
                max-width: 100%;
                max-height: 200px;
            }

            .message-file {
                max-width: 100%;
                font-size: 0.78rem;
            }

            .preview-area {
                padding: 6px 8px;
                gap: 8px;
            }

            .preview-item {
                width: 42px;
                height: 42px;
            }

            .modal-content {
                padding: 1rem;
                width: 97%;
                border-radius: 14px;
            }

            .modal-title {
                font-size: 1.1rem;
            }

            #custom-instructions {
                min-height: 80px;
                font-size: 0.88rem;
                padding: 0.8rem;
            }

            .api-input {
                font-size: 0.82rem;
                padding: 0.65rem 0.8rem;
            }

            .btn-primary,
            .btn-secondary {
                padding: 0.65rem 1rem;
                font-size: 0.88rem;
            }

            .scroll-bottom-btn {
                bottom: 70px;
                right: 10px;
                width: 34px;
                height: 34px;
            }

            /* Even smaller blobs on small phones */
            .blob { width: 200px; height: 200px; }
            .blob-2 { width: 180px; height: 180px; }
            .blob-3 { width: 150px; height: 150px; }

            .particles {
                display: none;
            }

            h1 { font-size: 1.1rem; }
            h2 { font-size: 1rem; }
            h3 { font-size: 0.95rem; }
        }

        /* Extra Small Phones (max-width: 360px) */
        @media (max-width: 360px) {
            .app-sidebar {
                width: 90vw;
            }

            .message {
                font-size: 0.85rem;
                padding: 0.65rem 0.8rem;
            }

            .segment-btn {
                padding: 0.3rem 0.5rem;
                font-size: 0.68rem;
            }

            #user-input {
                font-size: 0.85rem;
            }

            .action-btn {
                width: 34px;
                height: 34px;
            }

            .file-upload-label {
                width: 30px;
                height: 30px;
            }

            pre {
                font-size: 0.74rem !important;
            }
        }
    </style>
</head>

<body>
    <div class="bg-gradient">
        <div class="mesh-gradient"></div>
        <div class="blob"></div>
        <div class="blob-2"></div>
    </div>

    <main class="app-container">
        <!-- Sidebar -->
        <aside id="app-sidebar" class="app-sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-logo">
                    <img src="logo.png" alt="AI HUB" class="sidebar-logo-img">
                    <span class="sidebar-logo-text">AI HUB</span>
