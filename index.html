    <script>
        // Sidebar controls
        function toggleSidebar() {
            const sidebar = document.getElementById('app-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar) {
                if (window.innerWidth <= 768) {
                    const isOpen = sidebar.classList.toggle('open');
                    if (overlay) overlay.classList.toggle('visible', isOpen);
                } else {
                    sidebar.classList.toggle('collapsed');
                }
            }
        }

        function closeSidebarMobile() {
            if (window.innerWidth <= 768) {
                const sidebar = document.getElementById('app-sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                if (sidebar) sidebar.classList.remove('open');
                if (overlay) overlay.classList.remove('visible');
            }
        }

        // Configuration
        const CONFIG_SYNC_URL = 'https://script.google.com/macros/s/AKfycbzsoNxLlIb4Pvcv0iyZe_uyCen1z6QRFHyWQsk2tSiRQdaXQtMFG_5RYTOaH43xHjnrzA/exec';

        // API Keys Configuration (Persisted in LocalStorage)
        const API_KEYS = {
            gemini: localStorage.getItem('ai_hub_gemini_key') || '',
            deepseek: localStorage.getItem('ai_hub_openrouter_key') || '',
            alibaba: localStorage.getItem('ai_hub_alibaba_key') || ''
        };

        const MODELS = {
            free: { name: 'OpenRouter Free', model: 'openrouter/free', vision: true, fileUpload: true },
            deepseek: { name: 'DeepSeek V4 Flash', model: 'deepseek/deepseek-v4-flash', vision: false, fileUpload: false },
            qwen: { name: 'Qwen Coder', model: 'qwen3.6-plus', vision: false, fileUpload: false, apiUrl: 'https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completionsm' },
            gemini: { name: 'Gemini 3 Flash', model: 'gemini-3-flash-preview', vision: true, fileUpload: true }
        };

        let currentProvider = 'free';
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let conversationHistory = JSON.parse(localStorage.getItem('ai_hub_history')) || [];
        let selectedFileData = null;

        // Load history on startup
        window.addEventListener('DOMContentLoaded', () => {
            if (conversationHistory.length > 0) {
                conversationHistory.forEach(msg => {
                    appendMessage(msg.role, msg.content, msg.role === 'assistant' ? 'Saved Context' : null, false);
                });
            }

            if (!API_KEYS.gemini || !API_KEYS.deepseek || !localStorage.getItem('ai_hub_custom_prompt')) {
                syncFromSheet();
            }
        });

        function saveHistory() {
            localStorage.setItem('ai_hub_history', JSON.stringify(conversationHistory));
        }

        function clearChat() {
            closeSidebarMobile();
            if (confirm('Hapus semua riwayat percakapan?')) {
                conversationHistory = [];
                localStorage.removeItem('ai_hub_history');
                chatMessages.innerHTML = '';
                const sysMsg = document.createElement('div');
                sysMsg.style.cssText = 'text-align: center; font-size: 0.75rem; color: var(--text-muted); margin: 1rem 0;';
                sysMsg.textContent = 'Conversation cleared.';
                chatMessages.appendChild(sysMsg);
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const isImage = file.type.startsWith('image/');
            const isText = file.type.startsWith('text/') ||
                ['application/json', 'application/javascript', 'application/typescript'].includes(file.type) ||
                /\.(txt|md|csv|json|js|ts|py|html|css|cfm|go|sql)$/i.test(file.name);

            const reader = new FileReader();

            if (isImage) {
                reader.onload = ev => {
                    selectedFileData = {
                        fileType: 'image',
                        name: file.name,
                        mimeType: file.type,
                        base64: ev.target.result.split(',')[1],
                        preview: ev.target.result
                    };
                    showPreview(selectedFileData);
                };
                reader.readAsDataURL(file);
            } else if (isText) {
                reader.onload = ev => {
                    selectedFileData = {
                        fileType: 'text',
                        name: file.name,
                        mimeType: 'text/plain',
                        text: ev.target.result,
                        preview: null
                    };
                    showPreview(selectedFileData);
                };
                reader.readAsText(file);
            } else {
                // PDF / DOCX / XLSX → base64 binary
                reader.onload = ev => {
                    selectedFileData = {
                        fileType: 'document',
                        name: file.name,
                        mimeType: file.type || 'application/octet-stream',
                        base64: ev.target.result.split(',')[1],
                        preview: null
                    };
                    showPreview(selectedFileData);
                };
                reader.readAsDataURL(file);
            }
        }

        function showPreview(fileData) {
            const container = document.getElementById('preview-area');
            container.style.display = 'flex';
            if (fileData.fileType === 'image') {
                container.innerHTML = `
                    <div class="preview-item">
                        <img src="${fileData.preview}">
                        <button class="remove-preview" onclick="clearFile()">×</button>
                    </div>`;
            } else {
                const icon = fileData.fileType === 'document' ? '📄' : '📝';
                container.innerHTML = `
                    <div class="preview-item preview-doc">
                        <span class="doc-icon">${icon}</span>
                        <span class="doc-name">${fileData.name}</span>
                        <button class="remove-preview" style="position:static;margin-left:auto;" onclick="clearFile()">×</button>
                    </div>`;
            }
        }

        function clearFile() {
            selectedFileData = null;
            document.getElementById('preview-area').style.display = 'none';
            document.getElementById('file-input').value = '';
        }

        // Customization Persistence
        function openSettings() {
            closeSidebarMobile();
            document.getElementById('settings-modal').style.display = 'flex';
            document.getElementById('custom-instructions').value = localStorage.getItem('ai_hub_custom_prompt') || '';
            document.getElementById('api-key-gemini').value = localStorage.getItem('ai_hub_gemini_key') || '';
            document.getElementById('api-key-openrouter').value = localStorage.getItem('ai_hub_openrouter_key') || '';
            document.getElementById('api-key-alibaba').value = localStorage.getItem('ai_hub_alibaba_key') || '';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveSettings() {
            const prompt = document.getElementById('custom-instructions').value.trim();
            const geminiKey = document.getElementById('api-key-gemini').value.trim();
            const openrouterKey = document.getElementById('api-key-openrouter').value.trim();
            const alibabaKey = document.getElementById('api-key-alibaba').value.trim();

            localStorage.setItem('ai_hub_custom_prompt', prompt);
            localStorage.setItem('ai_hub_gemini_key', geminiKey);
            localStorage.setItem('ai_hub_openrouter_key', openrouterKey);
            localStorage.setItem('ai_hub_alibaba_key', alibabaKey);

            // Update runtime keys
            API_KEYS.gemini = geminiKey;
            API_KEYS.deepseek = openrouterKey;
            API_KEYS.alibaba = alibabaKey;

            closeSettings();

            const sysMsg = document.createElement('div');
            sysMsg.style.cssText = 'text-align: center; font-size: 0.75rem; color: var(--secondary); margin: 0.5rem 0; font-weight: 600;';
            sysMsg.textContent = 'Settings updated and saved locally!';
            chatMessages.appendChild(sysMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function syncFromSheet(e) {
            const btn = e ? e.target : null;
            const originalText = btn ? btn.innerHTML : '';
            if (btn) {
                btn.textContent = 'Syncing...';
                btn.disabled = true;
            }

            try {
                const response = await fetch(CONFIG_SYNC_URL);
                if (!response.ok) throw new Error('Gagal terhubung ke server konfigurasi.');

                const data = await response.json();
                let keysFound = 0;
                let instructionsFound = 0;

                // 1. Process API Keys
                if (data.keys && Array.isArray(data.keys)) {
                    data.keys.forEach(item => {
                        if (updateKeyLocal(item.type.toLowerCase(), item.key)) keysFound++;
                    });
                }

                // 2. Process System Instructions from "customize" sheet
                if (data.instructions && Array.isArray(data.instructions)) {
                    const combinedInstructions = data.instructions
                        .map(item => item.detail)
                        .filter(detail => detail)
                        .join('\n\n');

                    if (combinedInstructions) {
                        localStorage.setItem('ai_hub_custom_prompt', combinedInstructions);
                        const textarea = document.getElementById('custom-instructions');
                        if (textarea) textarea.value = combinedInstructions;
                        instructionsFound++;
                    }
                }

                if (keysFound > 0 || instructionsFound > 0) {
                    // Update runtime values
                    API_KEYS.gemini = localStorage.getItem('ai_hub_gemini_key');
                    API_KEYS.deepseek = localStorage.getItem('ai_hub_openrouter_key');

                    if (e) alert(`Sinkronisasi Berhasil!\n- ${keysFound} API Keys\n- System Instructions diperbarui`);
                } else {
                    if (e) alert('Tidak ada data baru yang ditemukan di server.');
                }
            } catch (err) {
                console.error('Sync Error:', err);
                if (e) alert('Error: ' + err.message + '\n\nPastikan Apps Script sudah diperbarui dan di-deploy ulang.');
            } finally {
                if (btn) {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }
        }

        async function pushInstructionsToSheet(e) {
            const btn = e ? e.target : null;
            const originalText = btn ? btn.innerHTML : '';
            const instructions = document.getElementById('custom-instructions').value.trim();

            if (!instructions) {
                alert('System Instructions kosong! Tidak ada yang bisa di-upload.');
                return;
            }

            if (!confirm('Apakah Anda yakin ingin memperbarui System Instructions di Google Sheet?\nTindakan ini akan menimpa data yang ada di sheet "customize".')) {
                return;
            }

            if (btn) {
                btn.textContent = 'Pushing...';
                btn.disabled = true;
            }

            try {
                // Send POST request with action updateInstructions
                const response = await fetch(CONFIG_SYNC_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8' // Simple content-type to avoid CORS preflight options
                    },
                    body: JSON.stringify({
                        action: 'updateInstructions',
                        instructions: instructions
                    })
                });

                if (!response.ok) throw new Error('Gagal terhubung ke server konfigurasi.');

                const result = await response.json();
                if (result.status === 'success') {
                    alert('Sukses! System Instructions berhasil diperbarui di Google Sheets.');
                } else {
                    throw new Error(result.message || 'Gagal memperbarui di server.');
                }
            } catch (err) {
                console.error('Push Error:', err);
                alert('Error: ' + err.message + '\n\nPastikan Apps Script Anda mendukung metode POST (doPost) dan sudah dideploy sebagai versi baru.');
            } finally {
                if (btn) {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }
        }

        function updateKeyLocal(type, key) {
            if (type.includes('gemini')) {
                localStorage.setItem('ai_hub_gemini_key', key);
                const input = document.getElementById('api-key-gemini');
                if (input) input.value = key;
                return true;
            } else if (type.includes('openrouter') || type.includes('deepseek')) {
                localStorage.setItem('ai_hub_openrouter_key', key);
                const input = document.getElementById('api-key-openrouter');
                if (input) input.value = key;
                return true;
            } else if (type.includes('alibaba') || type.includes('qwen') || type.includes('ali')) {
                localStorage.setItem('ai_hub_alibaba_key', key);
                const input = document.getElementById('api-key-alibaba');
                if (input) input.value = key;
                return true;
            }
            return false;
        }

        // Auto-sync on load if configuration is missing
        window.addEventListener('DOMContentLoaded', () => {
            if (!API_KEYS.gemini || !API_KEYS.deepseek || !localStorage.getItem('ai_hub_custom_prompt')) {
                syncFromSheet();
            }
        });

        function switchModel(provider) {
            currentProvider = provider;
            document.querySelectorAll('.segment-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase().includes(provider));
            });

            // Update active model name in header
            const modelNameEl = document.getElementById('active-model-name');
            if (modelNameEl) {
                modelNameEl.textContent = MODELS[provider].name;
            }

            const sysMsg = document.createElement('div');
            sysMsg.style.cssText = 'text-align: center; font-size: 0.75rem; color: var(--text-muted); margin: 0.5rem 0; opacity: 0.7;';
            sysMsg.textContent = `Switched to ${MODELS[provider].name}`;
            chatMessages.appendChild(sysMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        const STATUS_STATES = [
            { label: 'Active', color: '#10b981' },
            { label: 'Busy', color: '#ef4444' },
            { label: 'Away', color: '#f59e0b' }
        ];
        let statusIdx = 0;

        function toggleStatus() {
            statusIdx = (statusIdx + 1) % STATUS_STATES.length;
            const s = STATUS_STATES[statusIdx];
            
            // Update flag color in sidebar status indicator
            const flag = document.getElementById('flag-icon');
            if (flag) flag.style.color = s.color;
            
            // Update title label of status button
            const badge = document.getElementById('model-status-badge');
            if (badge) badge.title = s.label;
            
            // Update description text in sidebar status panel
            const statusText = document.getElementById('sidebar-status-text');
            if (statusText) statusText.textContent = s.label;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !selectedFileData) return;

            // Validasi file upload support
            if (selectedFileData) {
                const m = MODELS[currentProvider];
                if (selectedFileData.fileType === 'image' && !m.vision) {
                    alert(`Model ${m.name} tidak mendukung input gambar. Ganti ke Free atau Gemini.`);
                    return;
                }
                if (selectedFileData.fileType !== 'image' && !m.fileUpload) {
                    alert(`Model ${m.name} tidak mendukung upload file/dokumen. Gunakan Free atau Gemini.`);
                    return;
                }
            }

            // Simpan data file ke variabel lokal sebelum di-clear
            const fileToSend = selectedFileData;

            appendMessage('user', text, '', true, fileToSend);

            // Clear input segera untuk responsivitas UI
            userInput.value = '';
            userInput.style.height = 'auto';
            userInput.disabled = true;
            sendBtn.disabled = true;
            clearFile();

            showLoading();

            // Simpan riwayat dengan info file jika ada
            const historyEntry = { role: 'user', content: text };
            if (fileToSend) {
                historyEntry.file = {
                    fileType: fileToSend.fileType,
                    name: fileToSend.name,
                    mimeType: fileToSend.mimeType,
                    base64: fileToSend.base64 || null,
                    text: fileToSend.text || null
                };
                // Backward-compat: juga simpan di image untuk riwayat lama
                if (fileToSend.fileType === 'image') historyEntry.image = { mimeType: fileToSend.mimeType, base64: fileToSend.base64 };
            }
            conversationHistory.push(historyEntry);
            saveHistory();

            const performApiCall = async (provider) => {
                let url, body, headers = { 'Content-Type': 'application/json' };

                if (provider === 'gemini') {
                    url = `https://generativelanguage.googleapis.com/v1beta/models/${MODELS.gemini.model}:generateContent?key=${API_KEYS.gemini}`;

                    const customPrompt = localStorage.getItem('ai_hub_custom_prompt');
                    let contents = conversationHistory.map(msg => {
                        const parts = [{ text: msg.content || "Analyze this" }];

                        // Sertakan file jika ada di pesan ini
                        const fd = msg.file || (msg.image ? { fileType: 'image', mimeType: msg.image.mimeType, base64: msg.image.base64 } : null);
                        if (fd) {
                            if (fd.fileType === 'text') {
                                // Teks: tambahkan sebagai teks biasa
                                parts.push({ text: `\n\n[Lampiran: ${fd.name || 'file.txt'}]\n\`\`\`\n${fd.text}\n\`\`\`` });
                            } else if (fd.base64) {
                                // Gambar / PDF / DOCX → inlineData
                                parts.push({ inlineData: { mimeType: fd.mimeType, data: fd.base64 } });
                            }
                        }
                        return {
                            role: msg.role === 'assistant' ? 'model' : 'user',
                            parts: parts
                        };
                    });

                    // Inject custom prompt as a system-like part for Gemini
                    if (customPrompt) {
                        contents.unshift({
                            role: 'user',
                            parts: [{ text: `SYSTEM INSTRUCTION: ${customPrompt}\n\nUnderstood? Please follow this instruction strictly.` }]
                        }, {
                            role: 'model',
                            parts: [{ text: 'I understand and will follow your custom instructions strictly.' }]
                        });
                    }

                    body = {
                        contents,
                        generationConfig: {
                            maxOutputTokens: 8192,
                            temperature: 0.7
                        }
                    };
                } else if (provider === 'qwen') {
                    url = `https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions`;
                    headers['Authorization'] = `Bearer ${API_KEYS.alibaba}`;
                    headers['HTTP-Referer'] = window.location.href;
                    headers['X-Title'] = 'AI HUB';

                    const customPrompt = localStorage.getItem('ai_hub_custom_prompt') || 'You are a helpful assistant';

                    const messages = [{ role: 'system', content: customPrompt }];
                    conversationHistory.forEach(msg => {
                        messages.push({ role: msg.role, content: msg.content });
                    });

                    body = {
                        model: MODELS.qwen.model,
                        messages,
                        max_tokens: 8192,
                        temperature: 0.7
                    };
                } else {
                    url = 'https://openrouter.ai/api/v1/chat/completions';
                    headers['Authorization'] = `Bearer ${API_KEYS.deepseek}`;
                    headers['HTTP-Referer'] = window.location.href;
                    headers['X-OpenRouter-Title'] = 'AI HUB';

                    const customPrompt = localStorage.getItem('ai_hub_custom_prompt') || 'You are a helpful assistant';

                    // Filter riwayat untuk OpenRouter (bersihkan gambar jika model tidak mendukung vision)
                    const isVisionModel = MODELS[provider].vision;
                    const messages = [{ role: 'system', content: customPrompt }];

                    conversationHistory.forEach(msg => {
                        const fd = msg.file || (msg.image ? { fileType: 'image', mimeType: msg.image.mimeType, base64: msg.image.base64 } : null);
                        if (fd && fd.fileType === 'text' && fd.text) {
                            // OpenRouter prompt caching format for text file attachments
                            const contentParts = [
                                {
                                    type: 'text',
                                    text: 'Use the reference below when answering.'
                                },
                                {
                                    type: 'text',
                                    text: `[Lampiran: ${fd.name || 'file.txt'}]\n\`\`\`\n${fd.text}\n\`\`\``,
                                    cache_control: {
                                        type: 'ephemeral'
                                    }
                                },
                                {
                                    type: 'text',
                                    text: msg.content || 'Summarize the main implementation details.'
                                }
                            ];
                            messages.push({ role: msg.role, content: contentParts });
                        } else if (fd && isVisionModel) {
                            const contentParts = [{ type: 'text', text: msg.content || 'Analyze this' }];
                            if (fd.fileType === 'image') {
                                contentParts.push({ type: 'image_url', image_url: { url: `data:${fd.mimeType};base64,${fd.base64}` } });
                            } else if (fd.fileType === 'document' && fd.base64) {
                                // PDF / DOCX via base64 — Vision models often support it via image_url trick
                                contentParts.push({ type: 'image_url', image_url: { url: `data:${fd.mimeType};base64,${fd.base64}` } });
                            }
                            messages.push({ role: msg.role, content: contentParts });
                        } else {
                            messages.push({ role: msg.role, content: msg.content });
                        }
                    });

                    body = {
                        messages: messages,
                        model: MODELS[provider].model,
                        max_tokens: 4000
                    };
                }

                const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
                if (!res.ok) {
                    const errorText = await res.text();
                    let errMsg = 'API Error';
                    try {
                        const errJson = JSON.parse(errorText);
                        errMsg = errJson.error?.message || errJson.message || errMsg;
                    } catch (_) { }
                    throw new Error(errMsg);
                }

                const data = await res.json();

                // Qwen (via OpenRouter) menggunakan format data.choices seperti OpenAI
                const aiResponse = (provider === 'free' || provider === 'deepseek' || provider === 'qwen')
                    ? data.choices?.[0]?.message?.content
                    : data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (!aiResponse) {
                    throw new Error('Gagal mendapatkan respon.');
                }

                return aiResponse;
            };

            // Priority fallback list
            const fallbackPriority = ['qwen', 'deepseek', 'gemini'];

            // Build the queue of providers to try: selected one first, then others in priority order
            const providersToTry = [currentProvider];
            fallbackPriority.forEach(p => {
                if (p !== currentProvider) {
                    providersToTry.push(p);
                }
            });

            const hasKey = (provider) => {
                if (provider === 'gemini') return !!API_KEYS.gemini;
                if (provider === 'qwen') return !!API_KEYS.alibaba;
                return !!API_KEYS.deepseek;
            };

            let aiResponse = null;
            let finalUsedProvider = currentProvider;
            let success = false;
            let lastError = null;

            try {
                for (const provider of providersToTry) {
                    if (!hasKey(provider)) {
                        console.warn(`Skipping fallback provider ${provider}: API Key missing.`);
                        continue;
                    }

                    if (fileToSend) {
                        const m = MODELS[provider];
                        if (fileToSend.fileType === 'image' && !m.vision) {
                            console.warn(`Skipping provider ${provider}: Model does not support images.`);
                            continue;
                        }
                        if (fileToSend.fileType !== 'image' && !m.fileUpload) {
                            console.warn(`Skipping provider ${provider}: Model does not support text/doc attachments.`);
                            continue;
                        }
                    }

                    try {
                        console.log(`Attempting API hit using provider: ${provider}`);
                        try {
                            // Attempt 1
                            aiResponse = await performApiCall(provider);
                        } catch (firstErr) {
                            console.warn(`API call failed for ${provider}, retrying once...`, firstErr);
                            // Attempt 2 (Retry)
                            aiResponse = await performApiCall(provider);
                        }

                        finalUsedProvider = provider;
                        success = true;
                        break;
                    } catch (err) {
                        console.warn(`Provider ${provider} failed completely: ${err.message}`);
                        lastError = err;
                    }
                }

                if (!success) {
                    throw new Error(lastError ? lastError.message : 'Semua model gagal merespon.');
                }

                conversationHistory.push({ role: 'assistant', content: aiResponse });
                saveHistory();

                const sourceLabel = finalUsedProvider !== currentProvider
                    ? `${MODELS[finalUsedProvider].name} (Fallback)`
                    : MODELS[currentProvider].name;
                appendMessage('assistant', aiResponse, sourceLabel);
            } catch (err) {
                appendMessage('assistant', `Error: ${err.message}`, 'System Error');
            } finally {
                hideLoading();
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        async function copyText(text, btn) {
            try {
                await navigator.clipboard.writeText(text);
                const originalContent = btn.innerHTML;
                btn.classList.add('copied');
                btn.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                `;
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = originalContent;
                }, 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }

        function copyCode(btn) {
            const code = btn.closest('.code-wrapper').querySelector('code').innerText;
            copyText(code, btn);
        }

        function copyMessage(btn) {
            const raw = btn.closest('.message').dataset.raw;
            copyText(raw, btn);
        }

        function parseMarkdown(text) {
            // 1. Escape HTML
            let src = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // 2. Extract code blocks into placeholders
            const codeBlocks = [];
            src = src.replace(/```(\w+)?([\s\S]*?)```/g, function (_, lang, code) {
                const language = lang || 'plaintext';
                const idx = codeBlocks.length;
                codeBlocks.push(`<div class="code-wrapper">
                    <span class="code-lang-label">${language}</span>
                    <button class="copy-btn" onclick="copyCode(this)" title="Copy Code">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                    <pre class="language-${language}"><code class="language-${language}">${code.trim()}</code></pre>
                </div>`);
                return `\n%%CODEBLOCK_${idx}%%\n`;
            });

            // 3. Parse tables
            src = src.replace(/((?:^\|.+\|[ ]*$\n?)+)/gm, function (tableBlock) {
                const rows = tableBlock.trim().split('\n').filter(r => r.trim());
                if (rows.length < 2) return tableBlock;

                // Check if second row is separator
                const sep = rows[1];
                if (!/^\|[\s\-:|]+\|$/.test(sep.trim())) return tableBlock;

                const parseRow = r => r.split('|').slice(1, -1).map(c => c.trim());
                const headers = parseRow(rows[0]);
                let tableHtml = '<table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
                for (let i = 2; i < rows.length; i++) {
                    const cols = parseRow(rows[i]);
                    tableHtml += '<tr>' + cols.map(c => `<td>${c}</td>`).join('') + '</tr>';
                }
                tableHtml += '</tbody></table>';
                return tableHtml;
            });

            // 4. Process line by line
            const lines = src.split('\n');
            const out = [];
            let inUl = false, inOl = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];

                // Code block placeholder — pass through
                if (/^%%CODEBLOCK_\d+%%$/.test(line.trim())) {
                    if (inUl) { out.push('</ul>'); inUl = false; }
                    if (inOl) { out.push('</ol>'); inOl = false; }
                    out.push(line);
                    continue;
                }

                // Table html — pass through
                if (line.trim().startsWith('<table')) {
                    if (inUl) { out.push('</ul>'); inUl = false; }
                    if (inOl) { out.push('</ol>'); inOl = false; }
                    out.push(line);
                    continue;
                }

                // Horizontal rule
                if (/^---+$/.test(line.trim()) || /^\*\*\*+$/.test(line.trim())) {
                    if (inUl) { out.push('</ul>'); inUl = false; }
                    if (inOl) { out.push('</ol>'); inOl = false; }
                    out.push('<hr>');
                    continue;
                }

                // Headings
                const headMatch = line.match(/^(#{1,3}) (.+)$/);
                if (headMatch) {
                    if (inUl) { out.push('</ul>'); inUl = false; }
                    if (inOl) { out.push('</ol>'); inOl = false; }
                    const level = headMatch[1].length;
                    out.push(`<h${level}>${inlineFmt(headMatch[2])}</h${level}>`);
                    continue;
                }

                // Bullet list
                const bulletMatch = line.match(/^[\s]*[-*] (.+)$/);
                if (bulletMatch) {
                    if (inOl) { out.push('</ol>'); inOl = false; }
                    if (!inUl) { out.push('<ul>'); inUl = true; }
                    out.push(`<li>${inlineFmt(bulletMatch[1])}</li>`);
                    continue;
                }

                // Numbered list
                const numMatch = line.match(/^[\s]*(\d+)\. (.+)$/);
                if (numMatch) {
                    if (inUl) { out.push('</ul>'); inUl = false; }
                    if (!inOl) { out.push('<ol>'); inOl = true; }
                    out.push(`<li>${inlineFmt(numMatch[2])}</li>`);
                    continue;
                }

                // Close open lists on blank or non-list line
                if (inUl) { out.push('</ul>'); inUl = false; }
                if (inOl) { out.push('</ol>'); inOl = false; }

                // Blank line
                if (line.trim() === '') {
                    out.push('');
                    continue;
                }

                // Normal paragraph line
                out.push(`<p>${inlineFmt(line)}</p>`);
            }

            if (inUl) out.push('</ul>');
            if (inOl) out.push('</ol>');

            // 5. Rejoin and restore code blocks
            let result = out.join('\n');
            codeBlocks.forEach((block, idx) => {
                result = result.replace(`%%CODEBLOCK_${idx}%%`, block);
            });

            // Clean up empty paragraphs
            result = result.replace(/<p>\s*<\/p>/g, '');

            return result;
        }

        // Inline formatting helper
        function inlineFmt(s) {
            return s
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>');
        }

        function appendMessage(role, text, source = '', animate = true, fileData = null) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            if (!animate) div.style.animation = 'none';
            div.dataset.raw = text;

            // Tampilkan lampiran file di bubble pesan user
            let imageHtml = '';
            if (role === 'user' && fileData) {
                if (fileData.fileType === 'image' && fileData.preview) {
                    imageHtml = `<img src="${fileData.preview}" class="message-img">`;
                } else if (fileData.fileType === 'text') {
                    imageHtml = `<div class="message-file">📝 ${fileData.name}</div>`;
                } else if (fileData.fileType === 'document') {
                    imageHtml = `<div class="message-file">📄 ${fileData.name}</div>`;
                }
            }

            // Robust markdown parser
            let html = parseMarkdown(text);

            // Add Minimal Action Row
            const actionsHtml = `
            <div class="message-actions">
                <span class="msg-meta">${source ? source : 'You'}</span>
                <button class="action-btn-subtle" onclick="copyMessage(this)" title="Copy Chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
            </div>`;

            div.innerHTML = html + imageHtml + actionsHtml;
            chatMessages.appendChild(div);

            // Trigger Prism highlighting for the new element
            if (window.Prism) {
                div.querySelectorAll('pre code').forEach((block) => {
                    Prism.highlightElement(block);
                });
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showLoading() {
            const l = document.createElement('div');
            l.id = 'loading';
            l.className = 'loading-bubble';
            l.innerHTML = '<div class="bounce"></div><div class="bounce"></div><div class="bounce"></div>';
            chatMessages.appendChild(l);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideLoading() {
            const l = document.getElementById('loading');
            if (l) l.remove();
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        userInput.addEventListener('paste', (e) => {
            const pasteData = (e.clipboardData || window.clipboardData).getData('text');

            // Logika deteksi kode sederhana:
            // 1. Memiliki banyak baris (> 2 baris)
            // 2. Mengandung simbol khas kode atau kata kunci pemrograman
            const lines = pasteData.split('\n');
            const codePatterns = /[{}();\[\]]|=|=>|function|var|const|let|if|else|for|while|import|export|class|def |async|await|query|select|update|delete|cfquery|cfset/i;

            if (lines.length > 2 && codePatterns.test(pasteData)) {
                // Jangan double wrap jika user sudah memberikan backticks
                if (!pasteData.trim().startsWith('```')) {
                    e.preventDefault();

                    const start = userInput.selectionStart;
                    const end = userInput.selectionEnd;
                    const currentVal = userInput.value;

                    // Bungkus dengan backticks
                    const wrappedCode = `\n\`\`\`\n${pasteData}\n\`\`\`\n`;

                    userInput.value = currentVal.substring(0, start) + wrappedCode + currentVal.substring(end);

                    // Atur posisi kursor setelah paste
                    userInput.selectionStart = userInput.selectionEnd = start + wrappedCode.length;

                    // Trigger resize textarea
                    userInput.dispatchEvent(new Event('input'));
                }
            }
        });

        userInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        // Paste Screenshot Support
        userInput.addEventListener('paste', function (e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.indexOf('image/') !== -1) {
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        selectedFileData = {
                            fileType: 'image',
                            name: 'clipboard-image.png',
                            mimeType: blob.type,
                            base64: event.target.result.split(',')[1],
                            preview: event.target.result
                        };
                        showPreview(selectedFileData);
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        // Visual Viewport API for dynamic keyboard sizing on mobile devices
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const height = window.visualViewport.height;
                const container = document.querySelector('.app-container');

                // Only apply visualViewport height on mobile layouts
                if (window.innerWidth <= 768) {
                    container.style.height = `${height}px`;
                    // Smoothly scroll down to keep the active typing and last message visible
                    setTimeout(() => {
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }, 50);
                } else {
                    container.style.height = '92vh';
                }
            });
        }

        // Floating Scroll to Bottom visibility handler
        chatMessages.addEventListener('scroll', () => {
            const btn = document.getElementById('scroll-bottom-btn');
            if (btn) {
                // Show button if user has scrolled up by more than 300px
                const isScrolledUp = chatMessages.scrollHeight - chatMessages.clientHeight - chatMessages.scrollTop > 300;
                if (isScrolledUp) {
                    btn.classList.add('visible');
                } else {
                    btn.classList.remove('visible');
                }
            }
        });

        function scrollToBottom(smooth = true) {
            closeSidebarMobile();
            chatMessages.scrollTo({
                top: chatMessages.scrollHeight,
                behavior: smooth ? 'smooth' : 'auto'
            });
        }
    </script>
